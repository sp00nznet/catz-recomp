; WIN.INI substitute for the recomp.
;
; Under Win16 the game keeps its [Catz] settings in WIN.INI, and writes them
; there as you play (adopting a cat sets Cat1/Age1). We have no Windows 3.1
; WIN.INI, and GetPrivateProfileString with a NULL filename means exactly that
; file, so the shim falls back to this one first (see ini_resolve in
; win16_impl.c). Only keys the engine cannot supply a working default for
; belong here — everything else already has a sensible built-in default.
;
; Cat1 is appended to the install root by the engine, so it is relative and
; keeps its leading separator. CATZ0.CAT ships with the game.

[Catz]
Cat1=\CATZ0.CAT
Age1=0

; The engine narrates its own startup through OutputDebugString, gated on this
; key (normally C:\WINDOWS\catzdbug.ini). Worth its noise while bringing up.
Want Debug Strings=1
